<!doctype html><meta charset="utf-8"><title>BRWW render export</title><style>body{background:#1d120b;color:#eee;font:18px Arial}#cup{position:relative;width:340px;height:480px}button{padding:20px}</style><h1>BRWW cup render export</h1><div id="cup"></div><button disabled>Export 420 frames</button><p role="status">Loading model</p><a hidden>Download renders</a><script type="module">
import {mountCup} from './cup-scene.js';
const model=await mountCup(document.querySelector('#cup'),{exportMode:true});const button=document.querySelector('button'),status=document.querySelector('[role=status]');button.disabled=!model;status.textContent=model?'Model ready':'WebGL unavailable';
// Store-mode ZIP with CRC32, allowing frame export without a third-party library.
const table=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
const crc=b=>{let n=0xffffffff;for(const x of b)n=table[(n^x)&255]^(n>>>8);return(n^0xffffffff)>>>0;};
const header=(size)=>new DataView(new ArrayBuffer(size));let url;
button.onclick=async()=>{button.disabled=true;const chunks=[],central=[];let offset=0;
for(let i=0;i<420;i++){const b=new Uint8Array(await(await model.exportFrame(Math.PI+Math.sin(i/420*2*Math.PI)*1.15)).arrayBuffer());const name=new TextEncoder().encode(String(i).padStart(3,'0')+'.png');const c=crc(b),h=header(30);h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,b.length,true);h.setUint32(22,b.length,true);h.setUint16(26,name.length,true);chunks.push(h.buffer,name,b);const d=header(46);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,c,true);d.setUint32(20,b.length,true);d.setUint32(24,b.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);central.push(d.buffer,name);offset+=30+name.length+b.length;status.textContent=`Rendered ${i+1}/420`;}
const centralSize=central.reduce((n,b)=>n+(b.byteLength??b.length),0);const end=header(22);end.setUint32(0,0x06054b50,true);end.setUint16(8,420,true);end.setUint16(10,420,true);end.setUint32(12,centralSize,true);end.setUint32(16,offset,true);url=URL.createObjectURL(new Blob([...chunks,...central,end.buffer],{type:'application/zip'}));const a=document.querySelector('a');a.href=url;a.download='brww-cup-renders.zip';a.hidden=false;a.textContent='Download renders';status.textContent='420 transparent frames ready';};
</script>
